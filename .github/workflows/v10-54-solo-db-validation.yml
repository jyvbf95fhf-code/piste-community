name: V10.54 Solo ephemeral database validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solo-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: piste_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d piste_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: piste_test
    steps:
      - uses: actions/checkout@v4
      - name: Verify tested revision
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Apply local baseline
        run: psql -v ON_ERROR_STOP=1 -f scripts/sql/v10-54-solo-local-baseline.sql
      - name: Apply V10.54 migration locally
        run: psql -v ON_ERROR_STOP=1 -f PISTE_V10.54_SOLO_MODES.sql
      - name: Run SQL/RLS/RPC integration tests
        run: psql -v ON_ERROR_STOP=1 -f scripts/sql/test-v10-54-solo.sql
      - name: Roll back locally
        run: psql -v ON_ERROR_STOP=1 -f scripts/sql/v10-54-solo-rollback.sql
      - name: Reapply migration locally
        run: psql -v ON_ERROR_STOP=1 -f PISTE_V10.54_SOLO_MODES.sql
      - name: Run static regression guards
        run: |
          node scripts/check-v10-54-solo-migration.js
          node scripts/check-v10-54-reference-route.js
          node scripts/check-v10-54-coaching-reliability.js
          node scripts/check-v10-54-global-location-auth.js
          node scripts/check-v10-54-global-location-manager.js
          node scripts/check-v10-54-coaching-contract-parity.js
          node scripts/check-v10-53-solo-external-traceur.js
          node scripts/check-v10-53-ops-scent-corridor.js
          node --check app.js
          git diff --check
