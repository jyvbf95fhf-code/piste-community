name: Community map parity
on:
  push:
    branches:
      - feature/community-archive-map-parity-20261122
  pull_request:
    paths:
      - 'premium/src/community-*.mjs'
      - 'premium/tests/community-corridor-sharing.test.mjs'
      - '.github/workflows/community-map-parity.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify community corridor contract
        run: node --test premium/tests/community-corridor-sharing.test.mjs
