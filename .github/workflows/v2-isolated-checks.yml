name: V2 isolated checks

on:
  push:
    branches:
      - feature/v2-premium-chatgpt-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate Vercel config and deployment isolation
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const config = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          assert.equal(config.git?.deploymentEnabled?.['feature/v2-premium-chatgpt-ci'], false);
          assert.equal(config.outputDirectory, '.');
          assert.equal(config.buildCommand, 'node scripts/generate-version.js');
          console.log('Vercel config and V2 branch isolation: OK');
          NODE
      - name: Check source and entry point
        run: |
          node --check scripts/generate-version.js
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('index.html', 'utf8');
          assert.match(html, /<html[^>]+lang="fr"/);
          assert.match(html, /<main>/);
          console.log('Static entry point: OK');
          NODE
      - name: Verify build script in temporary directory
        run: |
          tmp="$(mktemp -d)"
          cp scripts/generate-version.js "$tmp/"
          (cd "$tmp" && GIT_COMMIT_SHA="$GITHUB_SHA" node generate-version.js)
          VERSION_FILE="$tmp/version.json" node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const data = JSON.parse(fs.readFileSync(process.env.VERSION_FILE, 'utf8'));
          assert.match(data.build, /^[0-9a-f]{7}$/i);
          assert.ok(data.generatedAt);
          console.log('Isolated build metadata: OK');
          NODE
